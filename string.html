<!DOCTYPE html>
<html>
<body bgcolor="pink">
<h1><i><center>STRING AND MATHS FUNCTIONS</center></i></h1>
<script>
var a="good mrng";
var b="hello";
var c="good evng";
document.write("string 1=" + a +"<br><br>");
document.write("string 2=" + b +"<br><br>");
document.write("string 3=" + c +"<br><br>");
document.write("<h2>STRING FUNCTIONS</h2>");
document.write("CONCATENATION=" + b + a + "<br><br>");
document.write("UPPERCASE=" + a.toUpperCase() + "<br><br>");
document.write("UPPERCASE=" + b.toUpperCase() + "<br><br>");
document.write("UPPERCASE=" + c.toUpperCase() + "<br><br>");
document.write("LOWERCASE=" + a.toLowerCase() + "<br><br>");
document.write("LOWERCASE=" + b.toLowerCase() + "<br><br>");
document.write("LOWERCASE=" + c.toLowerCase() + "<br><br>");
document.write(a.replace("good mrng","hii"));
document.write("<h2>MATHS FUNCTIONS</h2>");
var x=25;
var y=4;
document.write("square root=" + Math.sqrt(x) + "<br><br>");
document.write("square root=" + Math.sqrt(y) + "<br><br>");
document.write("power= " + Math.pow(x,2) + "<br><br>");
document.write("power= " + Math.pow(y,2) + "<br><br>");
document.write("absolute= " + Math.abs(-10) + "<br><br>");
document.write("round= " + Math.round(4.6) + "<br><br>");
document.write("maximum= " + Math.max(x,y) + "<br><br>");
document.write("miniimum= " + Math.min(x,y) + "<br><br>");
</script>
</body>
</html>
